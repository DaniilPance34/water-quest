<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Water Quest</title>
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <img src="img/cw_logo_horizontal.png"
     alt="charity: water logo"
     class="charity-logo">

     <h1>💧 Water Quest</h1>
    <p class="game-instructions">
      Collect 20 yellow water cans in 30 seconds!
      Avoid dirty water!
    </p>

    <div class="stats">
      <p>Cans Collected: <span id="current-cans">0</span></p>
      <p>Time Left: <span id="timer">30</span>s</p>
    </div>

    <div id="achievements" class="achievement" aria-live="polite"></div>
    <div class="game-grid"></div>

    <button id="start-game">Start Game</button>
    <button id="reset-game">Reset Game</button>

    <p class="mission">
      Every drop matters! Learn more at charity: water.
    </p>
  </div>

  <script src="script.js"></script>
</body>
</html>
